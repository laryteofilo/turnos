<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escala de Turnos</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  color: #1f2937;
}

header {
  background: #172554;
  color: white;
  padding: 24px 30px;
}

header h1 {
  margin: 0;
  font-size: 26px;
}

header p {
  margin: 6px 0 0;
  opacity: .8;
}

.container {
  max-width: 1500px;
  margin: auto;
  padding: 25px;
}

.topo {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.navegacao {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

button {
  border: 0;
  background: #2563eb;
  color: white;
  padding: 10px 14px;
  border-radius: 7px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  opacity: .88;
}

.btn-secundario {
  background: white;
  color: #374151;
  border: 1px solid #d1d5db;
}

.semana {
  font-size: 18px;
  font-weight: bold;
  min-width: 210px;
  text-align: center;
}

.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
  margin-bottom: 25px;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 10px;
  border: 1px solid #e5e7eb;
}

.card span {
  font-size: 13px;
  color: #6b7280;
}

.card strong {
  display: block;
  font-size: 25px;
  margin-top: 5px;
}

.painel {
  background: white;
  border-radius: 10px;
  border: 1px solid #e5e7eb;
  overflow: hidden;
}

.painel-titulo {
  padding: 18px 20px;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.painel-titulo h2 {
  margin: 0;
  font-size: 18px;
}

.tabela-wrapper {
  overflow-x: auto;
}

table {
  border-collapse: collapse;
  width: 100%;
  min-width: 1100px;
}

th {
  background: #eef2ff;
  padding: 12px 8px;
  border: 1px solid #d1d5db;
  font-size: 12px;
  text-transform: uppercase;
}

td {
  border: 1px solid #e5e7eb;
  height: 58px;
  text-align: center;
  padding: 5px;
}

.horario {
  background: #f9fafb;
  font-size: 12px;
  font-weight: bold;
  min-width: 125px;
}

.horario small {
  display: block;
  color: #6b7280;
  margin-top: 4px;
}

.turno {
  cursor: pointer;
  transition: .15s;
  min-width: 115px;
}

.turno:hover {
  background: #f3f4f6;
}

.pessoa {
  padding: 7px 5px;
  border-radius: 5px;
  font-weight: bold;
  font-size: 12px;
  margin: 2px;
}

.larissa {
  background: #3b82f6;
  color: white;
}

.yessica {
  background: #ef7777;
  color: #4b1111;
}

.gabryelle {
  background: #facc15;
  color: #422006;
}

.ronny {
  background: #22a861;
  color: white;
}

.roel {
  background: #42b8b4;
  color: #073b3a;
}

.vazio {
  color: #9ca3af;
  font-size: 20px;
}

.descanso {
  background: #f3f4f6;
  font-weight: bold;
}

.observacoes {
  margin-top: 20px;
  background: #fff;
  padding: 18px;
  border-radius: 10px;
  border: 1px solid #e5e7eb;
}

.observacoes textarea {
  width: 100%;
  min-height: 70px;
  border: 1px solid #d1d5db;
  border-radius: 7px;
  padding: 10px;
  resize: vertical;
  font-family: inherit;
}

/* MODAL */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.modal-box {
  background: white;
  width: 90%;
  max-width: 420px;
  border-radius: 12px;
  padding: 22px;
}

.modal-box h3 {
  margin-top: 0;
}

.opcao {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px;
  border-bottom: 1px solid #eee;
}

.modal-botoes {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
}

@media(max-width:800px) {
  .cards {
    grid-template-columns: repeat(2,1fr);
  }
}

</style>
</head>

<body>

<header>
  <h1>📅 Escala de Turnos</h1>
  <p>Gestão semanal da equipe</p>
</header>

<div class="container">

  <div class="topo">

    <div class="navegacao">
      <button class="btn-secundario" onclick="mudarSemana(-7)">← Semana anterior</button>
      <button onclick="irHoje()">Hoje</button>
      <button class="btn-secundario" onclick="mudarSemana(7)">Próxima semana →</button>
    </div>

    <div class="semana" id="semanaTitulo"></div>

  </div>

  <div class="cards">

    <div class="card">
      <span>👥 Equipe</span>
      <strong>5</strong>
    </div>

    <div class="card">
      <span>🌎 Fusos horários</span>
      <strong>2</strong>
    </div>

    <div class="card">
      <span>🕐 Turnos</span>
      <strong>6</strong>
    </div>

    <div class="card">
      <span>✏️ Modo</span>
      <strong>Editável</strong>
    </div>

  </div>

  <div class="painel">

    <div class="painel-titulo">
      <h2>Escala semanal</h2>
      <span>💡 Clique em uma célula para editar</span>
    </div>

    <div class="tabela-wrapper">

      <table>

        <thead>
          <tr>
            <th>Horário</th>
            <th id="dia0"></th>
            <th id="dia1"></th>
            <th id="dia2"></th>
            <th id="dia3"></th>
            <th id="dia4"></th>
            <th id="dia5"></th>
            <th id="dia6"></th>
          </tr>
        </thead>

        <tbody id="corpoTabela"></tbody>

      </table>

    </div>

  </div>

  <div class="observacoes">

    <strong>📝 Observações da semana</strong>

    <textarea id="observacao"
      placeholder="Ex.: feriado, alteração de turno, férias..."></textarea>

  </div>

</div>


<!-- JANELA PARA EDITAR TURNO -->

<div class="modal" id="modal">

  <div class="modal-box">

    <h3>Editar turno</h3>

    <p id="turnoSelecionado"></p>

    <label class="opcao">
      <input type="checkbox" value="Larissa">
      🔵 Larissa
    </label>

    <label class="opcao">
      <input type="checkbox" value="Yessica">
      🔴 Yessica
    </label>

    <label class="opcao">
      <input type="checkbox" value="Gabryelle">
      🟡 Gabryelle
    </label>

    <label class="opcao">
      <input type="checkbox" value="Ronny">
      🟢 Ronny
    </label>

    <label class="opcao">
      <input type="checkbox" value="Roel">
      🟦 Roel
    </label>

    <div class="modal-botoes">

      <button class="btn-secundario" onclick="fecharModal()">
        Cancelar
      </button>

      <button class="btn-secundario" onclick="limparTurno()">
        Limpar
      </button>

      <button onclick="salvarTurno()">
        Salvar
      </button>

    </div>

  </div>

</div>


<script>

const horarios = [
  ["12:00 - 20:00","03:00 - 11:00"],
  ["10:00 - 18:00","01:00 - 09:00"],
  ["06:00 - 14:00","09:00 - 18:00"],
  ["20:00 - 04:00","11:00 - 19:00"],
  ["20:00 - 04:00","14:00 - 22:00"],
  ["04:00 - 10:00","20:00 - 04:00"],
  ["23:00 - 07:00","22:00 - 06:00"]
];

const pessoas = {
  Larissa:"larissa",
  Yessica:"yessica",
  Gabryelle:"gabryelle",
  Ronny:"ronny",
  Roel:"roel"
};

let inicioSemana = obterSegunda(new Date());

let escala = {};

let celulaAtual = null;

function obterSegunda(data){

  const d = new Date(data);

  const dia = d.getDay();

  const diferenca = dia === 0 ? -6 : 1-dia;

  d.setDate(d.getDate()+diferenca);

  d.setHours(12,0,0,0);

  return d;
}

function chaveSemana(){

  return inicioSemana.toISOString().split("T")[0];

}

function carregarDados(){

  const salvo = localStorage.getItem("escala-turnos");

  if(salvo){
    escala = JSON.parse(salvo);
  }

}

function salvarDados(){

  localStorage.setItem(
    "escala-turnos",
    JSON.stringify(escala)
  );

}

function renderizar(){

  const dias = [
    "SEGUNDA",
    "TERÇA",
    "QUARTA",
    "QUINTA",
    "SEXTA",
    "SÁBADO",
    "DOMINGO"
  ];

  const opcoes = {
    day:"2-digit",
    month:"2-digit"
  };

  for(let i=0;i<7;i++){

    const data = new Date(inicioSemana);

    data.setDate(inicioSemana.getDate()+i);

    document.getElementById("dia"+i).innerHTML =
      dias[i] +
      "<br><strong>"+
      data.toLocaleDateString("pt-BR",opcoes)+
      "</strong>";

  }

  const fim = new Date(inicioSemana);

  fim.setDate(fim.getDate()+6);

  document.getElementById("semanaTitulo").innerText =
    inicioSemana.toLocaleDateString("pt-BR")+
    " — "+
    fim.toLocaleDateString("pt-BR");

  const corpo =
    document.getElementById("corpoTabela");

  corpo.innerHTML="";

  const semana = chaveSemana();

  if(!escala[semana]){
    escala[semana]={};
  }

  horarios.forEach((horario,h)=>{

    const linha=document.createElement("tr");

    const tdHorario=document.createElement("td");

    tdHorario.className="horario";

    tdHorario.innerHTML =
      "🇮🇹 "+horario[0]+
      "<small>🇵🇪 "+horario[1]+"</small>";

    linha.appendChild(tdHorario);

    for(let d=0;d<7;d++){

      const td=document.createElement("td");

      td.className="turno";

      td.dataset.horario=h;
      td.dataset.dia=d;

      const chave=h+"-"+d;

      const selecionados =
        escala[semana][chave] || [];

      if(selecionados.length===0){

        td.innerHTML='<span class="vazio">+</span>';

      }else{

        selecionados.forEach(nome=>{

          const div=document.createElement("div");

          div.className=
            "pessoa "+pessoas[nome];

          div.innerText=nome;

          td.appendChild(div);

        });

      }

      td.onclick=()=>abrirModal(td);

      linha.appendChild(td);

    }

    corpo.appendChild(linha);

  });

  carregarObservacao();

}

function abrirModal(td){

  celulaAtual=td;

  const h=td.dataset.horario;

  const d=td.dataset.dia;

  document.getElementById(
    "turnoSelecionado"
  ).innerText =
    "Horário: "+horarios[h][0];

  document
    .querySelectorAll(
      '#modal input[type="checkbox"]'
    )
    .forEach(i=>i.checked=false);

  const semana=chaveSemana();

  const atual=
    escala[semana][h+"-"+d] || [];

  atual.forEach(nome=>{

    const checkbox=
      document.querySelector(
        '#modal input[value="'+nome+'"]'
      );

    if(checkbox){
      checkbox.checked=true;
    }

  });

  document.getElementById("modal").style.display="flex";

}

function fecharModal(){

  document.getElementById("modal").style.display="none";

}

function salvarTurno(){

  const selecionados=[];

  document
    .querySelectorAll(
      '#modal input[type="checkbox"]:checked'
    )
    .forEach(i=>selecionados.push(i.value));

  const semana=chaveSemana();

  escala[semana][
    celulaAtual.dataset.horario+
    "-"+
    celulaAtual.dataset.dia
  ]=selecionados;

  salvarDados();

  fecharModal();

  renderizar();

}

function limparTurno(){

  const semana=chaveSemana();

  escala[semana][
    celulaAtual.dataset.horario+
    "-"+
    celulaAtual.dataset.dia
  ]=[];

  salvarDados();

  fecharModal();

  renderizar();

}

function mudarSemana(dias){

  inicioSemana.setDate(
    inicioSemana.getDate()+dias
  );

  renderizar();

}

function irHoje(){

  inicioSemana=obterSegunda(new Date());

  renderizar();

}

const observacao =
  document.getElementById("observacao");

observacao.addEventListener("input",()=>{

  localStorage.setItem(
    "obs-"+chaveSemana(),
    observacao.value
  );

});

function carregarObservacao(){

  observacao.value =
    localStorage.getItem(
      "obs-"+chaveSemana()
    ) || "";

}

carregarDados();

renderizar();

</script>

</body>
</html>
